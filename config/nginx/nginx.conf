user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name ernestoavedillo.com www.ernestoavedillo.com;
        
        # Validación para Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
        
        # Redirigir HTTP a HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS - Producción
    server {
        listen 443 ssl;
        http2 on;
        server_name ernestoavedillo.com www.ernestoavedillo.com;
        
        # Certificados Let's Encrypt
        ssl_certificate     /etc/letsencrypt/live/ernestoavedillo.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ernestoavedillo.com/privkey.pem;
        
        # SSL Configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        client_max_body_size 100M;
        
        location / {
            proxy_pass http://django:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;
        }
        
        location /static/ {
            alias /var/www/html/assets/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
