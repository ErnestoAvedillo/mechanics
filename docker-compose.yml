services:
  django:
    build:
      context: ./config/django/
      dockerfile: Dockerfile
    container_name: django
    image: mechanics-django:latest
    volumes:
      - .:/app/
    env_file:
      - .env
    expose:
      - 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('localhost', 8000), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  nginx:
    build:
      context: ./config/nginx/
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./certs:/etc/letsencrypt
      - ./certs-www:/var/www/certbot
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - django

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt:rw
      - ./certs-www:/var/www/certbot:rw
      - ./certbot-logs:/var/log/letsencrypt
    restart: unless-stopped
    profiles:
      - letsencrypt
    env_file:
      - .env

  mongodb:
    build:
      context: ./config/mongo/
      dockerfile: Dockerfile
    container_name: mongodb
    env_file:
      - .env
    ports:
      - "$MONGO_PORT:$MONGO_PORT"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
  mongo-express:
    build:
      context: ./config/mongo_express/
      dockerfile: Dockerfile
    container_name: mongo-express
    env_file:
      - .env
    ports:
      - "$MONGO_EXPRESS_PORT:$MONGO_EXPRESS_PORT"
    restart: unless-stopped
    depends_on:
      - mongodb
  postgres:
    build:
      context: ./config/postgres/
      dockerfile: Dockerfile
    container_name: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
    env_file:
      - .env
    ports:
      - "$POSTGRES_PORT:$POSTGRES_PORT"
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    restart: unless-stopped

