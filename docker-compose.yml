services:
  django:
    build:
      context: ./config/django/
      dockerfile: Dockerfile
    container_name: django
    volumes:
      - .:/app/
      - ./src:/app/src
      - ./templates:/app/templates
      - ./assets:/app/assets
    env_file:
      - .env
    expose:
      - 8000
    restart: unless-stopped
  nginx:
    build:
      context: ./config/nginx/
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./certs:/etc/letsencrypt
      - ./certs-www:/var/www/certbot
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - django

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt:rw
      - ./certs-www:/var/www/certbot:rw
      - ./certbot-logs:/var/log/letsencrypt
    restart: unless-stopped
    profiles:
      - letsencrypt
    env_file:
      - .env

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    env_file:
      - .env
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    env_file:
      - .env
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
  django_socket:
  mongodb_data:
  qdrant_data:
