services:
  django:
    build:
      context: ./config/django/
      dockerfile: Dockerfile
    container_name: django
    volumes:
      - .:/app/
      - ./src:/app/src
      - ./templates:/app/templates
      - ./assets:/app/assets
    env_file:
      - .env
    expose:
      - 8000
    restart: unless-stopped
  nginx:
    build:
      context: ./config/nginx/
      dockerfile: Dockerfile
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html
      - ./certs:/etc/letsencrypt
      - ./certs-www:/var/www/certbot
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - django

  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt:rw
      - ./certs-www:/var/www/certbot:rw
      - ./certbot-logs:/var/log/letsencrypt  # <--- Añade esto
#    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped
    profiles:
      - letsencrypt
    env_file:
      - .env

  # Nuevo servicio para pruebas
  tests:
    image: mcr.microsoft.com/playwright/python:v1.58.0-jammy
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DJANGO_URL=http://django:8000
    depends_on:
      - django
    # Este comando instala la librería y mantiene el contenedor encendido
    command: /bin/bash -c "pip install playwright && sleep infinity"

volumes:
  static_volume:
  media_volume:
  django_socket:
