{% load static %}

<div class="spring-form-container">
    <div class="diagram-wrapper">
        <img src="{% static 'muelles/img/sketch_muelle_compresion.jpg' %}" alt="Diagrama de muelle" class="spring-diagram">

        <div class="input-overlay De-field" style="top: 49%; left: 30%;">
            <input type="number"
                    step="0.1"
                    name="diametro_exterior"
                    id="diametro_exterior"
                    value="{{ request.POST.diametro_exterior }}"
                    required>
            <span class="label" data-tooltip="Diametro exterior (De) en mm"></span>
        </div>

        <div class="input-overlay Dm-field" style="top: 56.5%; left: 30%;">
            <input type="number"
                    step="0.1"
                    name="diametro_medio"
                    id="diametro_medio"
                    value="{{ request.POST.diametro_medio }}"
                    required>
            <span class="label" data-tooltip="Diametro medio (Dm) en mm"></span>
        </div>

        <div class="input-overlay Di-field" style="top: 66%; left: 30%;">
            <input type="number"
                    step="0.1"
                    name="diametro_interior"
                    id="diametro_interior"
                    value="{{ request.POST.diametro_interior }}"
                    required>
            <span class="label" data-tooltip="Diametro interior (Di) en mm"></span>
        </div>
        <div class="input-overlay nt-field" style="top: 15%; left: 60%;">
            <span class="label" data-tooltip="Numero total de espiras (nt)">Numero de espiras</span>
            <input type="number"
                    step="0.1"
                    name="numero_espiras"
                    id="numero_espiras"
                    value="{{ request.POST.numero_espiras }}"
                    required>
        </div>
        <div class="input-overlay L0-field" style="top: 42.5%; left: 94%;">
            <input type="number"
                    step="0.1"
                    name="longitud_libre"
                    id="longitud_libre"
                    value="{{ request.POST.longitud_libre }}"
                    required>
            <span class="label" data-tooltip="Longitud sin comprimir (L0) en mm"></span>
        </div>
        <div class="input-overlay A1-field" style="top: 53%; left: 87%;">
            <input type="number"
                    step="0.1"
                    name="longitud_inicial"
                    id="longitud_inicial"
                    value="{{ request.POST.longitud_inicial }}"
                    required>
            <span class="label" data-tooltip="Primera posición de carga"></span>
        </div>
        <div class="input-overlay A2-field" style="top: 62.5%; left: 80%;">
            <input type="number"
                    step="0.1"
                    name="longitud_final"
                    id="longitud_final"
                    value="{{ request.POST.longitud_final }}"
                    required>
            <span class="label" data-tooltip="Segunda posición de carga"></span>
        </div>
        <div class="input-overlay Ls-field" style="top: 82%; left: 66%;">
            <input type="number"
                    step="0.1"
                    name="longitud_solida"
                    id="longitud_solida"
                    value="{{ request.POST.longitud_solida }}"
                    readonly>
            <span class="label" data-tooltip="Longitud solida (Ls) en mm"></span>
        </div>
        <div class="input-overlay pitch-field" style="top: 31.5%; left: 45%;">
            <input type="number"
                    step="0.1"
                    name="pitch"
                    id="pitch"
                    value="{{ request.POST.pitch }}"
                    readonly>
            <span class="label" data-tooltip="Paso entre espiras (pitch) en mm"></span>
        </div>
    </div>



    <h3>Calcular</h3>
    <p>Complete los datos del muelle para obtener sus especificaciones tecnicas completas.</p>
    <button type="submit" class="calculate-btn">Calcular Especificaciones</button>
    <script src="{% static 'muelles/js/form_display_tooltips.js' %}"></script>
    <script src="{% static 'muelles/js/form_validation_compression.js' %}"></script>
</div>
