{% extends 'base.html' %}
{% load static %}
{% block title %}Iniciar Sesión{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'menuapp/css/estiloss.css' %}">
  <link rel="stylesheet" href="{% static 'menuapp/css/sidebar.css' %}">
{% endblock %}

{% block content %}
  <div class="page-background" style="background-image: url('{% static 'images/header-background.jpeg' %}');"></div>

  <main class="wrap">
    <section class="card" style="max-width: 400px; margin: 4rem auto; padding: 2rem;">
      <h1 style="text-align: center; margin-bottom: 1.5rem;">Iniciar Sesión</h1>
      
      <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        <div style="margin-bottom: 1rem;">
          <label for="id_username" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Usuario:</label>
          <input type="text" name="username" autofocus autocapitalize="none" autocomplete="username" maxlength="150" required id="id_username" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        <div style="margin-bottom: 1.5rem;">
          <label for="id_password" style="display: block; margin-bottom: 0.5rem; font-weight: bold;">Contraseña:</label>
          <input type="password" name="password" autocomplete="current-password" required id="id_password" style="width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        
        {% if form.errors %}
          <div class="error" style="color: red; margin-bottom: 1rem; font-size: 0.9em;">
            Tu usuario y/o contraseña no coinciden. Inténtalo de nuevo.
          </div>
        {% endif %}
        
        <button type="submit" style="width: 100%; padding: 0.75rem; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: bold;">Entrar</button>
        <input type="hidden" name="next" value="{{ next }}">
      </form>
    </section>
  </main>
{% endblock %}
