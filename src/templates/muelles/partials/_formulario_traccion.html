{% load static %}

<div class="spring-form-container">
    <div class="diagram-wrapper">
        <img src="{% static 'muelles/img/sketch_muelle_traccion.png' %}" alt="Diagrama de muelle" class="spring-diagram">

        <div class="input-overlay Dm-field" style="top: 40%; left: 30%;">
            <input type="number"
                    step="0.1"
                    name="diametro_medio"
                    id="diametro_medio"
                    value="{{ request.POST.diametro_medio }}"
                    required>
            <span class="label" data-tooltip="Diametro medio (Dm) en mm"></span>
        </div>

        <div class="input-overlay Di-field" style="top: 48%; left: 37%;">
            <input type="number"
                    step="0.1"
                    name="diametro_interior"
                    id="diametro_interior"
                    value="{{ request.POST.diametro_interior }}"
                    required>
            <span class="label" data-tooltip="Diametro interior (Di) en mm"></span>
        </div>

        <div class="input-overlay De-field" style="top: 40%; left: 45%;">
            <input type="number"
                    step="0.1"
                    name="diametro_exterior"
                    id="diametro_exterior"
                    value="{{ request.POST.diametro_exterior }}"
                    required>
            <span class="label" data-tooltip="Diametro exterior (De) en mm"></span>
        </div>

        <div class="input-overlay L0-field" style="top: 68%; left: 38%;">
            <input type="number"
                    step="0.1"
                    name="longitud_libre"
                    id="longitud_libre"
                    value="{{ request.POST.longitud_libre }}"
                    required>
            <span class="label" data-tooltip="Longitud sin comprimir (L0) en mm"></span>
        </div>
        <div class="input-overlay A1-field" style="top: 75%; left: 42%;">
            <input type="number"
                    step="0.1"
                    name="longitud_inicial"
                    id="longitud_inicial"
                    value="{{ request.POST.longitud_inicial }}"
                    required>
            <span class="label" data-tooltip="Primera posición de carga (L1)"></span>
        </div>
        <div class="input-overlay A2-field" style="top: 83%; left: 46%;">
            <input type="number"
                    step="0.1"
                    name="longitud_final"
                    id="longitud_final"
                    value="{{ request.POST.longitud_final }}"
                    required>
            <span class="label" data-tooltip="Segunda posición de carga"></span>
        </div>
        <div class="input-overlay tension_inicial" style="top: 5%; left: 30%;">
            <span class="label" data-tooltip="Tensión inicial (F1) en N     ">Tensión inicial</span>
            <input type="number"
                    step="0.1"
                    name="tension_inicial"
                    id="tension_inicial"
                    value="{{ request.POST.tension_inicial }}"
                    required>
        </div>
        <div class="input-overlay nt-field" style="top: 5%; left: 50%;">
            <span class="label" data-tooltip="Numero total de espiras (nt)">Numero de espiras</span>
            <input type="number"
                    step="0.1"
                    name="numero_espiras"
                    id="numero_espiras"
                    value="{{ request.POST.numero_espiras }}"
                    required>
        </div>
    </div>



    <h3>Calcular</h3>
    <p>Complete los datos del muelle para obtener sus especificaciones tecnicas completas.</p>
    <button type="submit" class="calculate-btn">Calcular Especificaciones</button>
    <script src="{% static 'muelles/js/form_display_tooltips.js' %}"></script>
</div>
