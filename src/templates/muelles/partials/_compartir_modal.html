{% load i18n %}
<div id="compartir-modal-overlay" class="compartir-modal-overlay" style="display:none;" data-share-url="{% url 'muelles_compartir_email' %}">
    <div class="compartir-modal-box" role="dialog" aria-modal="true" aria-labelledby="compartir-modal-title">
        <h3 id="compartir-modal-title">📧 {% trans "Compartir resultados por email" %}</h3>
        <p class="compartir-modal-hint">{% trans "Se enviará un enlace a la calculadora con estos mismos datos, desde la cuenta del sitio." %}</p>

        <div class="form-group">
            <label for="compartir-origen">{% trans "Tu email (remitente):" %}</label>
            <input type="email" id="compartir-origen" required>
        </div>
        <div class="form-group">
            <label for="compartir-destino">{% trans "Email destino:" %}</label>
            <input type="email" id="compartir-destino" required>
        </div>

        <div class="g-recaptcha" data-sitekey="{{ RECAPTCHA_SITE_KEY }}"></div>

        <div id="compartir-modal-status" class="compartir-modal-status"></div>

        <div class="modal-actions">
            <button type="button" id="compartir-cancelar-btn" class="load-btn">{% trans "Cancelar" %}</button>
            <button type="button" id="compartir-enviar-btn" class="share-btn">{% trans "Enviar" %}</button>
        </div>
    </div>
</div>
