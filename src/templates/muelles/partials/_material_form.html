{% load static %}
<div class="form-section compact">
    <h3>🔧 Material y Configuración</h3>
    
    <div class="form-group">
        <label for="material">Material:</label>
        <select name="material" id="material" required>
            <option value="">Seleccione un material...</option>
            {% for material in materiales %}
                <option value="{{ material.code }}" 
                        {% if request.POST.material == material.code %}selected{% endif %}
                        data-shear-modulus="{{ material.shear_modulus }}"
                        data-elastic-factor="{{ material.elastic_factor }}">
                    {{ material.name }}
                    {% if material.shear_modulus %}
                        - Módulo: {{ material.shear_modulus }} N/mm²
                    {% endif %}
                </option>
            {% empty %}
                <option value="SL">SL - Acero de alto carbono</option>
                <option value="SM">SM - Acero medio carbono</option>
                <option value="SH">SH - Acero duro</option>
            {% endfor %}
        </select>
        <small class="muted-small">Materiales cargados desde base de datos técnica</small>
    </div>
    
    <div class="form-group">
        <label for="diametro_hilo">Diámetro del hilo (mm):</label>
        <input type="number" 
                name="diametro_hilo" 
                id="diametro_hilo" 
                step="0.001" 
                min="0.001" 
                value="{{ request.POST.diametro_hilo }}"
                required>
    </div>
    <div class="form-group">
        <label>Shot peening:</label>
        <div class="toggle-container">
            <input type="checkbox" name="shot_peening" id="shot_peening" value="si"
                    {% if request.POST.shot_peening == 'si' %}checked{% endif %}>
            <label for="shot_peening" class="toggle-label">
                <span class="toggle-switch"></span>
                Desactivado
            </label>
            <small class="toggle-note">Mejora la resistencia a la fatiga</small>
        </div>
    </div>
    <div class="form-group">
        <label for="numero_ciclos">Numero de ciclos:</label>
        <select name="numero_ciclos" id="numero_ciclos" required>
            <option value="1e3" {% if request.POST.numero_ciclos == '1e3' %}selected{% endif %}>1,000</option>
            <option value="1e4" {% if request.POST.numero_ciclos == '1e4' %}selected{% endif %}>10,000</option>
            <option value="1e5" {% if request.POST.numero_ciclos == '1e5' %}selected{% endif %}>100,000</option>
            <option value="1e6" {% if request.POST.numero_ciclos == '1e6' %}selected{% endif %}>1,000,000</option>
            <option value="1e7" {% if request.POST.numero_ciclos == '1e7' %}selected{% endif %}>10,000,000</option>
        </select>
    </div>
</div>
<script src="{% static 'muelles/js/_material_form.js' %}"></script>
