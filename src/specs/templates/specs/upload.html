{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h3 class="mb-0">Añadir Documento al RAG</h3>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted small">El PDF se almacenará de forma segura en MongoDB GridFS y se etiquetará para tu usuario.</p>
                    
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="id_company" class="form-label">OEM / Empresa Relacionada (Opcional)</label>
                            {{ form.company.errors }}
                            <input type="text" name="company" class="form-control" id="id_company" placeholder="Ej. VW, BMW, Ford...">
                        </div>

                        <div class="mb-4">
                            <label for="id_pdf_file" class="form-label">Archivo PDF (Normativa, Spec, ISO...)</label>
                            {{ form.pdf_file.errors }}
                            <input type="file" name="pdf_file" class="form-control" id="id_pdf_file" accept=".pdf" required>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success btn-lg">Subir y Analizar</button>
                            <a href="{% url 'specs:document_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
